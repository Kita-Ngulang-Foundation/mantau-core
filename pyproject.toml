[project]
name = "mantau-core"
version = "0.1.0"
description = "Shared contracts, notification, resilience and telemetry for both Mantau backend scenarios"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "httpx>=0.27",
    "numpy>=1.26,<2.3",
    # IANA timezones for night windows; Windows ships no system database.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# Only needed if a backend actually sends FCM push (channels/push/fcm.py).
# Kept optional so importing mantau_core never requires a Google Cloud dep.
push = ["google-auth>=2.29", "requests>=2.31"]
# Only needed by the one adapter that talks to the mantau-AI package
# (distribution name "mantau-prototype", import name "mantau"). Pinned to a
# commit; bump deliberately once mantau-AI's tests are green.
detection = [
    "mantau-prototype @ git+https://github.com/Kita-Ngulang-Foundation/mantau-AI.git@3f69ed356ff4f264796261b5e20e323672997329",
]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mantau_core = [
    "contracts/fixtures/v1/*.json",
    "detection/fixtures/*.json",
    "detection/fixtures/pose_sequences/*.json",
    "activity/fixtures/activity_sequences/*.json",
]
