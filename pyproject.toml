[project]
name = "mantau-core"
version = "0.1.0"
description = "Shared contracts, notification, resilience and telemetry for both Mantau backend scenarios"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "httpx>=0.27",
    "numpy>=1.26,<2.3",
]

[project.optional-dependencies]
# Only needed if a backend actually sends FCM push (channels/push/fcm.py).
# Kept optional so importing mantau_core never requires a Google Cloud dep.
push = ["google-auth>=2.29"]
# Only needed by the one adapter that talks to the mantau-ai package.
detection = ["mantau @ git+https://github.com/Sxccv/mantau-prototype.git"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
